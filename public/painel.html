<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel de Status · Guaíba</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand sm">
      <img src="icons/icon.svg" alt="" width="30" height="30">
      <strong>Painel de Status</strong>
    </div>
    <div class="top-right">
      <span id="atualizado" class="pill">carregando…</span>
      <button id="sair" class="btn ghost" type="button">Sair</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Seções">
    <a href="#resumo" class="on">Resumo</a>
    <a href="#unidades">Unidades</a>
    <a href="#servidores">Servidores</a>
    <a href="#sistemas">Sistemas</a>
    <a href="#rede">Rede</a>
  </nav>

  <main class="container">
    <p id="aviso" class="banner" hidden></p>
    <section id="resumo"><div class="kpis" id="kpis"></div></section>

    <section id="unidades" class="sec fixa">
      <h2 class="sec-t"><span>Monitoramento das Unidades</span><span class="res" id="uni-res"></span></h2>
      <div id="uni-body"></div>
    </section>

    <details class="sec" id="servidores" data-k="servidores">
      <summary><span class="t">Monitoramento de Servidores</span><span class="res" id="srv-res"></span></summary>
      <div class="body" id="srv-body"></div>
    </details>

    <details class="sec" id="sistemas" data-k="sistemas">
      <summary><span class="t">Monitoramento de Sistemas</span><span class="res" id="sis-res"></span></summary>
      <div class="body"><div class="grid" id="sis-grid"></div></div>
    </details>

    <details class="sec" id="rede" data-k="rede">
      <summary><span class="t">Equipamentos de Rede</span><span class="res" id="rede-res"></span></summary>
      <div class="body"><div class="grid" id="rede-grid"></div></div>
    </details>

    <footer class="foot">Atualização automática a cada 60 s</footer>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
