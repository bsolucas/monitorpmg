<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1f">
  <meta name="robots" content="noindex, nofollow">
  <title>Monitoramento Prefeitura</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Monitoramento">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand sm">
      <img src="icons/icon.svg" alt="" width="30" height="30">
      <strong>Monitoramento Prefeitura</strong>
    </div>
    <div class="top-right">
      <button type="button" class="btn instalar" data-instalar hidden>Instalar</button>
      <span id="atualizado" class="pill">carregando…</span>
      <button id="sair" class="btn ghost" type="button">Sair</button>
    </div>
  </header>

  <main class="container">
    <p id="aviso" class="banner" hidden></p>

    <section class="hero card" id="hero" aria-live="polite"></section>

    <section class="bloco">
      <h2>Unidades com problema <span class="cont" id="prob-n"></span></h2>
      <div id="prob" class="lista-cards"></div>
    </section>

    <details class="acc" id="todas" data-k="todas">
      <summary><span class="t">Todas as unidades</span><span class="res" id="todas-res"></span></summary>
      <div class="corpo">
        <input id="busca" type="search" placeholder="Buscar unidade…" aria-label="Buscar unidade">
        <div id="tiles" class="tiles"></div>
      </div>
    </details>

    <h2 class="sep">Outras listas</h2>

    <details class="acc" id="equip" data-k="equip">
      <summary><span class="t">Monitoramento de Equipamentos</span><span class="res" id="equip-res"></span></summary>
      <div class="corpo"><div id="equip-body"></div></div>
    </details>

    <details class="acc" id="servidores" data-k="servidores">
      <summary><span class="t">Monitoramento de Servidores</span><span class="res" id="srv-res"></span></summary>
      <div class="corpo"><div id="srv-body"></div></div>
    </details>

    <details class="acc" id="sistemas" data-k="sistemas">
      <summary><span class="t">Monitoramento de Sistemas</span><span class="res" id="sis-res"></span></summary>
      <div class="corpo"><div id="sis-body"></div></div>
    </details>

    <footer class="foot">Atualização automática a cada 60 s</footer>
  </main>

  <script src="js/pwa.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
