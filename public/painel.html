<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel de Status · Guaíba</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand sm">
      <img src="icons/icon.svg" alt="" width="30" height="30">
      <strong>Painel de Status</strong>
    </div>
    <div class="top-right">
      <span id="atualizado" class="pill">carregando…</span>
      <button id="sair" class="btn ghost" type="button">Sair</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Seções">
    <a href="#resumo" class="on">Resumo</a>
    <a href="#vms">VMs</a>
    <a href="#sistemas">Sistemas</a>
    <a href="#unidades">Unidades</a>
    <a href="#rede">Rede</a>
  </nav>

  <main class="container">
    <p id="aviso" class="banner" hidden></p>
    <section id="resumo"><div class="kpis" id="kpis"></div></section>

    <section id="vms">
      <h2>Monitoramento de VMs <small id="vms-n"></small></h2>
      <div class="grid" id="vms-grid"></div>
    </section>

    <section id="sistemas">
      <h2>Monitoramento de Sistemas <small id="sis-n"></small></h2>
      <div class="grid" id="sis-grid"></div>
    </section>

    <section id="unidades">
      <h2>Monitoramento das Unidades <small id="uni-n"></small></h2>
      <div class="toolbar">
        <input id="busca" type="search" placeholder="Buscar unidade…" aria-label="Buscar unidade">
        <div class="chips" id="filtro">
          <button class="chip on" data-f="todas">Todas</button>
          <button class="chip" data-f="fora">Fora</button>
          <button class="chip" data-f="parcial">Parcial</button>
          <button class="chip" data-f="ok">No ar</button>
        </div>
      </div>
      <div class="grid small" id="uni-grid"></div>
    </section>

    <section id="rede">
      <h2>Equipamentos de Rede</h2>
      <div class="grid" id="rede-grid"></div>
    </section>

    <footer class="foot">Dados de demonstração · atualização automática a cada 60 s</footer>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
